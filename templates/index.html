<!DOCTYPE html>
<html>

<head>
    <title>Visual Search Scanner</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #000;
            color: #fff;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        .header {
            padding: 15px;
            background: rgba(0, 0, 0, 0.8);
            text-align: center;
            z-index: 10;
        }

        .header h1 {
            margin: 0;
            font-size: 18px;
            font-weight: 600;
            letter-spacing: 1px;
        }

        .scanner-container {
            flex: 1;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .video-feed {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.9), transparent);
            padding: 30px 20px;
            text-align: center;
        }

        .action-btn {
            background: #fff;
            color: #000;
            border: none;
            padding: 15px 30px;
            border-radius: 30px;
            font-size: 16px;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(255, 255, 255, 0.3);
            cursor: pointer;
            transition: transform 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }

        .action-btn:active {
            transform: scale(0.95);
        }

        .icon {
            font-size: 20px;
        }

        .hint {
            margin-bottom: 20px;
            color: #ccc;
            font-size: 14px;
        }
    </style>
</head>

<body>
    <div class="header">
        <h1>VISUAL SEARCH</h1>
    </div>

    <div class="scanner-container">
        <img src="/video_feed" class="video-feed" alt="Scanner Feed">
    </div>

    <div class="overlay">
        <div class="hint">Point at an object to identify it</div>
        <button class="action-btn" onclick="simulateSearch()">
            <span class="icon">🔍</span> Shop Similar Items
        </button>
    </div>

    <script>
        function simulateSearch() {
            alert("Simulating search for detected item...\n\n(In a real app, this would open a product results page!)");
        }
    </script>
</body>

</html>
